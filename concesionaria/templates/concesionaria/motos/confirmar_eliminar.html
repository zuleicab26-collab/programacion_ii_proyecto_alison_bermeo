{% extends 'concesionaria/base.html' %}

{% block title %}Eliminar moto{% endblock %}

{% block content %}
<h1>Eliminar moto</h1>

<p>¿Está seguro de que desea eliminar <strong>{{ moto }}</strong>?</p>
<p>Esta acción no se puede deshacer.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="boton-peligro">Sí, eliminar</button>
    <a class="boton boton-secundario" href="{% url 'moto_detail' moto.pk %}">Cancelar</a>
</form>
{% endblock %}
