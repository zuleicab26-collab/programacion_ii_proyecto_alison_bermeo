{% extends 'concesionaria/base.html' %}

{% block title %}{% if moto %}Editar moto{% else %}Nueva moto{% endif %}{% endblock %}

{% block content %}
<h1>{% if moto %}Editar moto{% else %}Nueva moto{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'moto_list' %}">Cancelar</a>
</form>
{% endblock %}
