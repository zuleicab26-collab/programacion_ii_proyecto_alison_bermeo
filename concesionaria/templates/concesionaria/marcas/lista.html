{% extends 'concesionaria/base.html' %}

{% block title %}Marcas{% endblock %}

{% block content %}
<h1>Marcas</h1>

<table border="1">
    <tr>
        <th>Nombre</th>
        <th>País de origen</th>
        <th>Motos</th>
    </tr>
    {% for marca in marcas %}
    <tr>
        <td><a href="{{ marca.get_absolute_url }}">{{ marca.nombre }}</a></td>
        <td>{{ marca.pais_origen }}</td>
        <td>{{ marca.motos.count }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No hay marcas registradas.</td></tr>
    {% endfor %}
</table>
{% endblock %}
