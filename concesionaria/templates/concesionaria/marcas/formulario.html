{% extends 'concesionaria/base.html' %}

{% block title %}{% if marca %}Editar marca{% else %}Nueva marca{% endif %}{% endblock %}

{% block content %}
<h1>{% if marca %}Editar marca{% else %}Nueva marca{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a class="boton boton-secundario" href="{% url 'marca_list' %}">Cancelar</a>
</form>
{% endblock %}
